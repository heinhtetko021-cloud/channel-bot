name: htech-forward

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Ping forward endpoint
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://channel-bot-jade.vercel.app/api/forward"