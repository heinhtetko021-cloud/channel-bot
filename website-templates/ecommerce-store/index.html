<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar E-Commerce Store Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #faf7f3;
            --accent: #c2775a;
            --accent-dark: #a65d42;
            --text-dark: #2d2a26;
            --text-light: #6b6560;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(45, 42, 38, 0.08);
            --shadow-lg: 0 10px 40px rgba(45, 42, 38, 0.12);
            --radius: 12px;
            --transition: all 0.3s ease;
            --font: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background-color: var(--primary);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header */
        header {
            background: var(--white);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .cart-btn {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .cart-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--text-dark);
            color: var(--white);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: var(--white);
            padding: 4rem 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        /* Search & Filter */
        .search-filter {
            margin-bottom: 2rem;
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid transparent;
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: var(--font);
            margin-bottom: 1rem;
            background: var(--white);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-btn {
            padding: 0.6rem 1.25rem;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            font-family: var(--font);
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--accent);
            color: var(--white);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .product-emoji {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            background: linear-gradient(135deg, #f8f4f0 0%, #f0ebe6 100%);
        }

        .product-info {
            padding: 1.25rem;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .add-to-cart {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            font-size: 0.95rem;
        }

        .add-to-cart:hover {
            background: var(--accent-dark);
        }

        /* Cart Drawer */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--white);
            z-index: 201;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-size: 1.25rem;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.75rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
        }

        .close-cart:hover {
            color: var(--accent);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.5rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
        }

        .cart-item-emoji {
            font-size: 2.5rem;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .cart-item-price {
            color: var(--accent);
            font-weight: 500;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: var(--primary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .qty-btn:hover {
            background: var(--accent);
            color: var(--white);
            border-color: var(--accent);
        }

        .remove-item {
            color: #e74c3c;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .remove-item:hover {
            text-decoration: underline;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid #eee;
            background: var(--primary);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            font-size: 1rem;
        }

        .checkout-btn:hover {
            background: var(--accent-dark);
        }

        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        .empty-cart p {
            margin-bottom: 0.5rem;
        }

        /* Checkout Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.25rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #eee;
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: var(--font);
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-order {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            font-size: 1rem;
        }

        .submit-order:hover {
            background: var(--accent-dark);
        }

        /* Order Confirmation */
        .confirmation {
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .confirmation h2 {
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .confirmation p {
            margin-bottom: 0.75rem;
            color: var(--text-light);
        }

        .payment-methods {
            background: var(--primary);
            padding: 1.25rem;
            border-radius: var(--radius);
            margin: 1.5rem 0;
            text-align: left;
        }

        .payment-methods h3 {
            margin-bottom: 0.75rem;
            color: var(--text-dark);
        }

        .payment-methods ul {
            list-style: none;
        }

        .payment-methods li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .payment-methods li:last-child {
            border-bottom: none;
        }

        .telegram-note {
            background: linear-gradient(135deg, #229ED9 0%, #1a87b8 100%);
            color: var(--white);
            padding: 1.25rem;
            border-radius: var(--radius);
            margin-top: 1.5rem;
        }

        .telegram-note p {
            color: var(--white);
            margin-bottom: 0.75rem;
        }

        .telegram-link {
            display: inline-block;
            background: var(--white);
            color: #229ED9;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .telegram-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.75rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
        }

        .close-modal:hover {
            color: var(--accent);
        }

        /* Footer */
        footer {
            background: var(--white);
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-light);
            border-top: 1px solid #eee;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 1.75rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                gap: 0.4rem;
            }

            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- HEADER -->
    <!-- ============================================ -->
    <header>
        <div class="header-content">
            <div class="logo" id="shopName">H-Tech Shop</div>
            <button class="cart-btn" onclick="toggleCart()">
                Cart <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- ============================================ -->
    <!-- HERO BANNER -->
    <!-- ============================================ -->
    <section class="hero">
        <h1>Welcome to H-Tech Shop</h1>
        <p>Discover amazing products at great prices. Shop now and enjoy fast delivery across Myanmar!</p>
    </section>

    <!-- ============================================ -->
    <!-- MAIN CONTENT -->
    <!-- ============================================ -->
    <main class="container">
        <!-- Search & Filter -->
        <div class="search-filter">
            <input type="text" class="search-box" placeholder="Search products..." id="searchBox">
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="all">All</button>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="productGrid"></div>
    </main>

    <!-- ============================================ -->
    <!-- CART DRAWER -->
    <!-- ============================================ -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">Ks 0</span>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- CHECKOUT MODAL -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Checkout</h2>
                <button class="close-modal" onclick="closeCheckout()">&times;</button>
            </div>
            <div class="modal-body" id="checkoutForm">
                <form onsubmit="submitOrder(event)">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="customerName" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="customerPhone" required placeholder="09xxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>Delivery Address</label>
                        <textarea id="customerAddress" rows="3" required placeholder="Enter your full address"></textarea>
                    </div>
                    <button type="submit" class="submit-order">Place Order</button>
                </form>
            </div>
            <div class="modal-body" id="orderConfirmation" style="display:none;"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- FOOTER -->
    <!-- ============================================ -->
    <footer>
        <p>&copy; 2026 <span id="footerShopName">H-Tech Studio</span>. All rights reserved.</p>
    </footer>

        const PRODUCTS = [

            { id: 19, name: "Laptop Sleeve", nameMy: "Laptop အိတ်", price: 22000, category: "Electronics", emoji: "💻" },
            { id: 20, name: "Desk Lamp", nameMy: "မီးအိမ်", price: 35000, category: "Home", emoji: "💡" }
        ];
    </script>

    <!-- ============================================ -->
    <!-- APPLICATION LOGIC -->
    <!-- ============================================ -->
    <script>
        // Initialize cart from localStorage or empty
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentFilter = 'all';
        let searchTerm = '';

        // ============================================
        // SAVE CART TO LOCALSTORAGE
        // ============================================
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        // ============================================
        // RENDER PRODUCTS
        // ============================================
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            let filtered = PRODUCTS;

            // Apply category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.category === currentFilter);
            }

            // Apply search filter
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(term) ||
                    p.category.toLowerCase().includes(term)
                );
            }

            grid.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-emoji">${product.emoji}</div>
                    <div class="product-info">
                        <div class="product-category">${product.category}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${CONFIG.currencyLabel} ${product.price.toLocaleString()}</div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-cart"><p>No products found</p></div>';
            }
        }

        // ============================================
        // RENDER FILTER BUTTONS
        // ============================================
        function renderFilterButtons() {
            const container = document.getElementById('filterButtons');
            const categories = ['all', ...new Set(PRODUCTS.map(p => p.category))];
            container.innerHTML = categories.map(cat => `
                <button class="filter-btn ${cat === currentFilter ? 'active' : ''}"
                        onclick="setFilter('${cat}')">
                    ${cat.charAt(0).toUpperCase() + cat.slice(1)}
                </button>
            `).join('');
        }

        // ============================================
        // FILTER & SEARCH
        // ============================================
        function setFilter(category) {
            currentFilter = category;
            renderFilterButtons();
            renderProducts();
        }

        function searchProducts(term) {
            searchTerm = term;
            renderProducts();
        }

        // ============================================
        // CART FUNCTIONS
        // ============================================
        function addToCart(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            updateCartUI();
            toggleCart(true);
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            updateCartUI();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    saveCart();
                    updateCartUI();
                }
            }
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            document.getElementById('cartCount').textContent = count;
            document.getElementById('cartTotal').textContent = `${CONFIG.currencyLabel} ${total.toLocaleString()}`;

            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart"><p>Your cart is empty</p><p>Start shopping to add items</p></div>';
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-emoji">${item.emoji}</div>
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${CONFIG.currencyLabel} ${item.price.toLocaleString()}</div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                                <button class="remove-item" onclick="removeFromCart(${item.id})">Remove</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // ============================================
        // CART DRAWER TOGGLE
        // ============================================
        function toggleCart(open = null) {
            const overlay = document.getElementById('cartOverlay');
            const drawer = document.getElementById('cartDrawer');

            if (open === null) {
                overlay.classList.toggle('active');
                drawer.classList.toggle('active');
            } else if (open) {
                overlay.classList.add('active');
                drawer.classList.add('active');
            } else {
                overlay.classList.remove('active');
                drawer.classList.remove('active');
            }
        }

        // ============================================
        // CHECKOUT FUNCTIONS
        // ============================================
        function openCheckout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            toggleCart(false);
            document.getElementById('checkoutModal').classList.add('active');
            document.getElementById('checkoutForm').style.display = 'block';
            document.getElementById('orderConfirmation').style.display = 'none';
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('active');
        }

        function submitOrder(event) {
            event.preventDefault();

            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const orderSummary = cart.map(item =>
                `${item.emoji} ${item.name} x${item.quantity} - ${CONFIG.currencyLabel} ${(item.price * item.quantity).toLocaleString()}`
            ).join('\n');

            document.getElementById('checkoutForm').style.display = 'none';
            document.getElementById('orderConfirmation').style.display = 'block';
            document.getElementById('orderConfirmation').innerHTML = `
                <div class="confirmation">
                    <h2>Order Confirmed!</h2>
                    <p>Thank you, <strong>${name}</strong>!</p>
                    <p>Phone: ${phone}</p>
                    <p>Delivery to: ${address}</p>
                    <div class="payment-methods">
                        <h3>Payment Methods Available:</h3>
                        <ul>
                            <li>📱 KBZPay - 09XXXXXXXXX</li>
                            <li>📱 WavePay - 09XXXXXXXXX</li>
                            <li>💵 Cash on Delivery (COD)</li>
                        </ul>
                    </div>
                    <div class="telegram-note">
                        <p>Please confirm your order via Telegram:</p>
                        <a href="${CONFIG.telegramLink}" target="_blank" class="telegram-link">
                            Open Telegram Bot
                        </a>
                    </div>
                    <button onclick="clearAndClose()" style="margin-top:1.5rem;padding:0.75rem 2rem;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-family:var(--font);">Done</button>
                </div>
            `;

            // Clear cart
            cart = [];
            saveCart();
            updateCartUI();
        }

        function clearAndClose() {
            closeCheckout();
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerAddress').value = '';
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Apply config to UI
            document.getElementById('shopName').textContent = CONFIG.shopName;
            document.querySelector('.hero h1').textContent = `Welcome to ${CONFIG.shopName}`;
            document.getElementById('footerShopName').textContent = CONFIG.shopName;
            document.title = `${CONFIG.shopName} - Online Store`;

            // Initialize
            renderFilterButtons();
            renderProducts();
            updateCartUI();
        });

        // Search event listener
        document.getElementById('searchBox').addEventListener('input', (e) => {
            searchProducts(e.target.value);
        });

        // Close modal on outside click
        document.getElementById('checkoutModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('checkoutModal')) {
                closeCheckout();
            }
        });
    </script>
</body>
</html>
